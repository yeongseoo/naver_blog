<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>네이버 블로그 브릿지 — 설정</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body { max-width: 560px; margin: 24px auto; }
    </style>
  </head>
  <body>
    <h1>네이버 블로그 브릿지 설정</h1>

    <div class="card">
      <label>웹 서비스 API 주소
        <input id="apiBase" type="url" placeholder="https://my-service.com/api/naver-bridge" />
        <small>이 주소 뒤에 <code>/pending</code>, <code>/result</code> 가 붙어 호출됩니다.</small>
      </label>

      <label>API 토큰
        <input id="token" type="password" placeholder="웹 서비스에서 발급한 토큰" autocomplete="off" />
        <small><code>Authorization: Bearer &lt;토큰&gt;</code> 헤더로 전송됩니다. 비워두면 보내지 않습니다.</small>
      </label>

      <div class="grid">
        <label>확인 주기(분)
          <input id="intervalMin" type="number" min="1" step="1" />
        </label>
        <label>1회 최대 발행 수
          <input id="batchSize" type="number" min="1" max="20" step="1" />
        </label>
      </div>

      <label>기본 발행 방식 <small>(글에 mode 가 없을 때)</small>
        <select id="defaultMode">
          <option value="publish">발행 (공개)</option>
          <option value="temp">임시저장</option>
        </select>
      </label>

      <label class="check">
        <input id="enabled" type="checkbox" /> 자동 동기화 켜기
      </label>

      <div class="buttons">
        <button id="btn-save" class="primary">저장</button>
      </div>
      <div id="save-msg" class="msg"></div>
    </div>

    <h2>점검</h2>
    <div class="card">
      <div class="buttons">
        <button id="btn-test-api">① 웹 서비스 연결 테스트</button>
        <button id="btn-test-naver">② 네이버 임시저장 테스트</button>
      </div>
      <small>① 은 글을 가져가지 않고(limit=0) 주소·토큰만 확인합니다.
        ② 는 테스트 글을 <b>임시저장</b>만 하며 공개 발행하지 않습니다.</small>
      <div id="test-msg" class="msg"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
