<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>네이버 블로그 브릿지</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body { width: 360px; }
    </style>
  </head>
  <body>
    <h1>네이버 블로그 브릿지</h1>

    <div class="card">
      <div class="row"><span>자동 동기화</span><b id="st-enabled">-</b></div>
      <div class="row"><span>웹 서비스</span><b id="st-api" class="ellipsis">-</b></div>
      <div class="row"><span>마지막 실행</span><b id="st-last">-</b></div>
      <div class="row"><span>결과</span><b id="st-result">-</b></div>
      <div class="row"><span>다음 실행</span><b id="st-next">-</b></div>
    </div>

    <div class="buttons">
      <button id="btn-sync" class="primary">지금 동기화</button>
      <button id="btn-options">설정</button>
    </div>
    <div id="msg" class="msg"></div>

    <h2>최근 기록</h2>
    <ul id="log" class="log"></ul>

    <script src="popup.js"></script>
  </body>
</html>
